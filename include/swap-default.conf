# Configuration for systemd-swap
# This file is part of systemd-swap.
# See swap.conf(5) for details.
#
# Values commented with ## are auto-detected based on hardware.
# Uncomment to override with custom values.

################################################################################
# Swap Mode
#
# auto            - Auto-detect best mode (default, recommended)
#                   - btrfs/ext4/xfs with enough disk → zram + swapfiles
#                   - LiveCD or no disk support → zram only
# zram+swapfile   - Zram + swap files (zram primary, swapfiles for overflow)
# zswap+swapfile  - Zswap + swap files (zswap compresses in kernel, writes back to disk)
# zram            - Zram only (no disk swap — LiveCD, low disk)
# manual          - Use explicit flags (zram_enabled, zswap_enabled, swapfc_enabled)
# disabled        - Disable swap management (service exits cleanly)
################################################################################

swap_mode=auto

################################################################################
# Zram Settings (used in zram and zram+swapfile modes)
#
# Zram creates compressed block devices in RAM. Size is virtual
# (uncompressed); actual RAM usage depends on compression ratio.
# At ~3.4x ratio with zstd, 150% disksize uses ~45% RAM when full.
#
# The daemon manages a dynamic pool of zram devices:
#   - Starts with 4 devices, splitting zram_size evenly between them
#   - Expands when utilization > 85%, up to zram_max_devices
#   - Contracts when utilization < 20% for 120s
#
# The count is not tied to CPU count: zram compresses using a stream per CPU,
# so one device already uses every core. More devices spread allocator
# contention, and each one costs a set of per-CPU streams per algorithm.
################################################################################

## zram_size=150%                  # Virtual disksize (% of RAM). Larger = more data in RAM
## zram_mem_limit=0%               # 0 = no limit (recommended). disksize controls capacity
## zram_prio=32767                 # Swap priority (max = 32767, higher = preferred)

################################################################################
# Zram Compression Rungs
#
# Pages are compressed twice, by two algorithms with different jobs.
#
#   main     - where pages end up and spend most of their life. Chosen for
#              compression ratio, since most of what sits in zram is cold.
#   initial  - a faster, weaker rung pages are staged in on the way out of RAM,
#              so a page about to be faulted straight back is cheap to reach.
#
# A page stays in the initial rung until it has gone untouched for
# zram_recomp_idle_age seconds, then it is recompressed into the main
# algorithm. This spends CPU you are not using on pages you are not touching.
#
# Promotion happens on a sweep, so a page is promoted somewhere between
# zram_recomp_idle_age and zram_recomp_idle_age + zram_recomp_interval seconds
# after its last access: it must pass the age check and then wait for the next
# sweep. With the defaults that is 10 to 11 minutes. Keep the interval well
# under the age or the age stops meaning much.
#
# Sweeping often is the cheap end of the trade. It does not change how much
# recompression happens (each page is promoted once either way), but it spreads
# that work into small frequent batches instead of one burst per sweep, and the
# burst is what gets noticed. What it does cost is the candidate scan, which
# walks the entry table in proportion to disksize rather than to how much of
# the device is in use.
#
# Sweeps are interleaved across the pool: one device is swept every
# zram_recomp_interval divided by the device count, so each device is still
# swept once per interval while each burst is only its share of the pool. The
# kernel promotes every idle page in one blocking write with no way to bound
# the work, so splitting across devices is what makes the batches smaller.
#
# The initial rung needs kernel 6.2+ with CONFIG_ZRAM_MULTI_COMP, and the age
# check needs CONFIG_ZRAM_TRACK_ENTRY_ACTIME. Where either is missing, pages go
# directly into the main algorithm and nothing else changes.
#
# Set zram_initial_alg= (empty) to always compress straight into main.
# Both rungs take a level, so zstd staging into denser zstd also works:
#
#   zram_alg=zstd            zram_alg_level=5
#   zram_initial_alg=zstd    zram_initial_level=1
#
# For lz4 the level is an acceleration factor where 1 is the minimum and the
# default, so the shipped value is a no-op there. It is spelled out so that
# switching the rung to zstd inherits a fast level rather than zstd's own
# default of 3.
################################################################################

## zram_alg=zstd                   # Main algorithm: zstd (best ratio), lz4, lzo
## zram_alg_level=3                # Level for main. Empty = kernel default
## zram_initial_alg=lz4            # Initial rung: lz4 (fastest). Empty = disabled
## zram_initial_level=1            # Level for initial rung
## zram_recomp_idle_age=600        # Promote pages untouched this long (seconds)
## zram_recomp_interval=60         # Seconds between promotion sweeps

# Zram Pool Tuning (advanced)
## zram_max_devices=8              # Upper bound on pool size (1-8)
## zram_expand_threshold=85        # Expand pool when utilization > this %
## zram_contract_threshold=20      # Contract pool when utilization < this %
## zram_expand_cooldown=10         # Seconds between expansions
## zram_contract_stability=120     # Seconds of low usage before contraction
## zram_min_free_ram=15            # Don't expand if free RAM < this %
## zram_check_interval=5           # Monitor interval in seconds

################################################################################
# Zswap Settings (used in zswap+swapfile mode)
#
# Zswap compresses pages in the kernel before writing to disk swap.
# With ~3x ratio, 8GB RAM + 45% pool = ~10.8GB effective swap in RAM.
# The shrinker writes cold pages to disk automatically.
################################################################################

## zswap_compressor=zstd           # Compression: lz4 (fastest), zstd (balanced), lzo
## zswap_zpool=zsmalloc            # Memory allocator (zsmalloc recommended)
## zswap_max_pool_percent=45       # Max RAM % for compressed pool
## zswap_shrinker_enabled=1        # Move cold pages to disk when pool is full
## zswap_accept_threshold=80       # Resume accepting pages when pool drops to this %

################################################################################
# SwapFile - Dynamic Swap Files (overflow for zram/zswap)
#
# Creates swap files on demand when memory pressure is high.
# Files are pre-allocated with NOCOW on btrfs for safety.
# Priority is lower than zram: kernel only uses them when zram is full.
################################################################################

## swapfile_path=/swapfile         # Base path for swap files
## swapfile_chunk_size=512M        # Size of each swap file
## swapfile_max_count=28           # Maximum number of swap files
## swapfile_free_ram_perc=20       # Create swap file when free RAM < this %
## swapfile_free_swap_perc=40      # Create swap file when free swap < this %
## swapfile_remove_free_swap_perc=70 # Remove swap file when free swap > this %

# Free space kept on the filesystem after a swap file is allocated. Accepts a
# percentage of the filesystem or a size. Empty uses 5%, clamped to between
# 1GB and 8GB, because neither form works alone: 5% of a small filesystem does
# not cover one btrfs metadata chunk, and 5% of a large one withholds far more
# than any filesystem needs.
#
# On btrfs the daemon additionally refuses to allocate below 1GB unallocated.
# btrfs reports free space inside already allocated data chunks as available
# even when nothing is left to carve a metadata chunk from, so a filesystem can
# fail writes and turn read-only while df still looks healthy. ext4 and xfs do
# not fail that way, but both fragment badly near full.

## swapfile_min_free_disk=         # e.g. 5% or 2G. Empty = 5%, clamped 1G-8G

## swapfile_discard=none           # Discard policy: none (safest), auto, once
## swapfile_nocow=1                # NOCOW (chattr +C) on btrfs (prevents deadlock)

## swapfile_btrfs_compress=        # Btrfs compression (only when nocow=0 + sparse_loop=1)
                                   # Options: zstd, lzo, zlib, none

################################################################################
# Loop Device Tuning (used in loop-backed swap modes)
################################################################################

## swapfile_loop_scheduler=auto    # I/O scheduler: auto, kyber, bfq, mq-deadline, none
## swapfile_loop_backing_fs=auto   # Backing filesystem: auto (host fs), f2fs

################################################################################
# MGLRU (Multi-Gen LRU) Settings
#
# MGLRU protects the working set from premature eviction (kernel 6.1+).
# min_ttl_ms sets the minimum age before a page can be reclaimed.
# Higher values = more protection, less reclaim.
################################################################################

## mglru_min_ttl_ms=1000           # Pages younger than this (ms) are never reclaimed

